# Sobe banco e aplicativo. A VM é compartilhada com o sistema farias-contabil: o Caddy dele
# (portas 80/443) encaminha app.arvirtual.com.br para este app pela rede Docker dele.
# As variáveis vêm do arquivo .env gerado pelo GitHub Actions (veja .env.example).
# Nome fixo: tudo deste app fica isolado no projeto "arvirtual-app" (containers, rede e volumes).
name: arvirtual-app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arvirtual
      POSTGRES_DB: arvirtual
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      default:
        # Nome exclusivo: o app também está na rede do outro sistema, que tem um serviço "db".
        aliases: [arvirtual-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arvirtual -d arvirtual"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    networks:
      default:
      proxy:
        aliases: [arvirtual-app]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:

networks:
  # Rede do Caddy do farias-contabil, que publica https://app.arvirtual.com.br.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-farias-contabil_default}

# Sobe banco e aplicativo, sem publicar portas na VM (ela é compartilhada com outro sistema).
# As variáveis vêm do arquivo .env gerado pelo GitHub Actions (veja .env.example).
# Nome fixo: tudo deste app fica isolado no projeto "arvirtual-app" (containers, rede e volumes).
name: arvirtual-app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arvirtual
      POSTGRES_DB: arvirtual
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arvirtual -d arvirtual"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # Publica https://app.arvirtual.com.br pela Cloudflare (conexão de saída):
  # não usa nenhuma porta da VM. Só sobe quando CF_TUNNEL_TOKEN está definido.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      - app

volumes:
  pgdata:
  uploads:

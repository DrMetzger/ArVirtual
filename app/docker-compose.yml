# Sobe banco e aplicativo. A VM é compartilhada: o app usa só a porta APP_PORT (padrão 8080).
# As variáveis vêm do arquivo .env gerado pelo GitHub Actions (veja .env.example).
# Nome fixo: tudo deste app fica isolado no projeto "arvirtual-app" (containers, rede e volumes).
name: arvirtual-app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arvirtual
      POSTGRES_DB: arvirtual
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arvirtual -d arvirtual"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      UPLOAD_DIR: /app/uploads
    # Acesso direto pelo IP da VM (as portas 80/443 são do outro sistema).
    ports:
      - "${APP_PORT:-8080}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:

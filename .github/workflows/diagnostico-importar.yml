name: Diagnóstico importador (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-importar.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Campos que as APIs devolvem para os próprios anúncios (sem dados pessoais)
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          import { createDecipheriv, createHash, createHmac } from "node:crypto";
          const sql = postgres(process.env.DATABASE_URL);
          const key = createHash("sha256").update(process.env.ENCRYPTION_KEY).digest();
          const dec = (v) => { const [, iv, tag, data] = v.split(":"); const d = createDecipheriv("aes-256-gcm", key, Buffer.from(iv, "base64")); d.setAuthTag(Buffer.from(tag, "base64")); return Buffer.concat([d.update(Buffer.from(data, "base64")), d.final()]).toString("utf8"); };
          const cfg = Object.fromEntries((await sql`select chave, valor, secreto from configuracoes where chave like 'shopee.%'`).map((r) => [r.chave, r.secreto ? dec(r.valor) : r.valor]));
          const contas = await sql`select marketplace, id_externo, access_token_enc from contas_marketplace`;
          const tk = (m) => { const c = contas.find((x) => x.marketplace === m); return c && { id: c.id_externo, token: dec(c.access_token_enc) }; };
          // ML
          const ml = tk("mercadolivre");
          const g = async (p) => { const r = await fetch("https://api.mercadolibre.com" + p, { headers: { Authorization: `Bearer ${ml.token}` } }); return [r.status, await r.json().catch(() => null)]; };
          let [s, it] = await g("/items/MLB4782851747");
          console.log("ML item", s, "fotos", it?.pictures?.length, "secure_url", Boolean(it?.pictures?.[0]?.secure_url), "video_id", it?.video_id ?? null, "sku", Boolean(it?.seller_custom_field || it?.attributes?.find((a) => a.id === "SELLER_SKU")), "attrs pacote", (it?.attributes ?? []).filter((a) => /PACKAGE|WEIGHT|HEIGHT|WIDTH|LENGTH|GTIN/.test(a.id)).map((a) => `${a.id}=${a.value_name}`).join(" "));
          [s, it] = await g("/items/MLB4782851747/description"); console.log("ML descricao", s, "chars", (it?.plain_text ?? "").length);
          // Shopee
          const sp = tk("shopee");
          const host = cfg["shopee.ambiente"] === "sandbox" ? "https://partner.test-stable.shopeemobile.com" : "https://partner.shopeemobile.com";
          const path = "/api/v2/product/get_item_base_info"; const ts = Math.floor(Date.now() / 1000);
          const sign = createHmac("sha256", cfg["shopee.partnerKey"]).update(`${cfg["shopee.partnerId"]}${path}${ts}${sp.token}${sp.id}`).digest("hex");
          const q = new URLSearchParams({ partner_id: cfg["shopee.partnerId"], timestamp: String(ts), access_token: sp.token, shop_id: sp.id, sign, item_id_list: "58266614930", need_tax_info: "false", need_complaint_policy: "false" });
          const r = await (await fetch(`${host}${path}?${q}`)).json();
          const x = r.response?.item_list?.[0];
          console.log("Shopee", r.error || "ok", "shop", sp.id, "fotos", x?.image?.image_url_list?.length, "video", (x?.video_info ?? []).length, "desc", (x?.description ?? "").length, "ext", JSON.stringify(x?.description_info ?? null)?.length, "peso", x?.weight, "dim", JSON.stringify(x?.dimension), "preco", JSON.stringify(x?.price_info?.[0]));
          // Magalu
          const mg = tk("magalu");
          const mr = await fetch("https://api.magalu.com/seller/v1/portfolios/skus/SPRTGTA", { headers: { Authorization: `Bearer ${mg.token}`, Accept: "application/json" } });
          const m = await mr.json();
          console.log("Magalu", mr.status, "fotos", m.images?.length, "videos", JSON.stringify(m.videos ?? []).slice(0, 120), "ncm", m.ncm, "dims", JSON.stringify(m.dimensions).slice(0, 300), "url", JSON.stringify(m.url_marketplace).slice(0, 160));
          const pr = await fetch("https://api.magalu.com/seller/v1/portfolios/prices/SPRTGTA", { headers: { Authorization: `Bearer ${mg.token}`, Accept: "application/json" } });
          console.log("Magalu preco", pr.status, (await pr.text()).slice(0, 300));
          await sql.end();
          JS
          REMOTO

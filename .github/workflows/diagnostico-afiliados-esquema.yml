name: Diagnóstico esquema completo afiliados (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-afiliados-esquema.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Amostras agregadas sem dados pessoais
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          import { createDecipheriv, createHash } from "node:crypto";
          const sql = postgres(process.env.DATABASE_URL);
          const rows = await sql`select chave, valor, secreto from configuracoes where chave in ('afiliados.appId','afiliados.secret')`;
          const key = createHash("sha256").update(process.env.ENCRYPTION_KEY).digest();
          const dec = (v) => { const [, iv, tag, data] = v.split(":"); const d = createDecipheriv("aes-256-gcm", key, Buffer.from(iv, "base64")); d.setAuthTag(Buffer.from(tag, "base64")); return Buffer.concat([d.update(Buffer.from(data, "base64")), d.final()]).toString("utf8"); };
          const cfg = Object.fromEntries(rows.map((r) => [r.chave, r.secreto ? dec(r.valor) : r.valor]));
          const chamar = async (query) => {
            const corpo = JSON.stringify({ query }); const ts = Math.floor(Date.now() / 1000);
            const sig = createHash("sha256").update(`${cfg["afiliados.appId"]}${ts}${corpo}${cfg["afiliados.secret"]}`).digest("hex");
            const r = await fetch("https://open-api.affiliate.shopee.com.br/graphql", { method: "POST", headers: { "Content-Type": "application/json", Authorization: `SHA256 Credential=${cfg["afiliados.appId"]}, Timestamp=${ts}, Signature=${sig}` }, body: corpo });
            return r.json().catch(async () => ({ texto: await r.text() }));
          };
          const agora = Math.floor(Date.now() / 1000), desde = agora - 89 * 86400;
          const conta = (arr) => Object.entries(arr.reduce((m, v) => ((m[v] = (m[v] ?? 0) + 1), m), {})).map(([k, n]) => `${k || "(vazio)"}=${n}`).join(" | ");
          const conv = await chamar(`{ conversionReport(purchaseTimeStart: ${desde}, purchaseTimeEnd: ${agora}, limit: 500) { nodes { referrer productType device buyerType utmContent netCommission totalCommission orders { orderStatus shopType items { shopId itemId attributionType channelType campaignType campaignPartnerName fraudStatus displayItemStatus refundAmount itemSellerCommission itemShopeeCommissionRate globalCategoryLv1Name itemNotes } } } pageInfo { hasNextPage } } }`);
          if (conv.errors) console.log("ERRO conv", JSON.stringify(conv.errors).slice(0, 500));
          const nos = conv.data?.conversionReport?.nodes ?? [];
          const its = nos.flatMap((n) => n.orders.flatMap((o) => o.items));
          console.log("== conversões 89d:", nos.length, "itens:", its.length, "itens distintos:", new Set(its.map((i) => i.itemId)).size);
          console.log("referrer:", conta(nos.map((n) => String(n.referrer).replace(/[?#].*/, "").slice(0, 60))));
          console.log("utmContent:", conta(nos.map((n) => n.utmContent)));
          console.log("productType:", conta(nos.map((n) => n.productType)), "device:", conta(nos.map((n) => n.device)));
          for (const k of ["attributionType", "channelType", "campaignType", "campaignPartnerName", "fraudStatus", "displayItemStatus", "globalCategoryLv1Name", "itemNotes"]) console.log(k + ":", conta(its.map((i) => String(i[k] ?? ""))));
          const po = await chamar(`{ partnerOrderReport(purchaseTimeStart: ${desde}, purchaseTimeEnd: ${agora}, limit: 100) { nodes { orderId productType orderStatus items { itemId itemName } extInfo { clickId videoId userType } } searchNextPageInfo { size searchNextToken } } }`);
          console.log("== partnerOrderReport erros:", JSON.stringify(po.errors ?? "").slice(0, 400));
          const pn = po.data?.partnerOrderReport?.nodes ?? [];
          console.log("pedidos:", pn.length, "com videoId:", pn.filter((n) => n.extInfo?.videoId).length, "videoIds:", conta(pn.map((n) => n.extInfo?.videoId ?? "")), "userType:", conta(pn.map((n) => n.extInfo?.userType ?? "")));
          for (const lt of [1, 2]) {
            const r = await chamar(`{ productOfferV2(listType: ${lt}, limit: 3) { nodes { itemId productName sales commissionRate } pageInfo { hasNextPage } } }`);
            console.log(`== productOfferV2 listType ${lt}`, JSON.stringify(r).slice(0, 500));
          }
          const feeds = await chamar("{ listItemFeeds { feeds { datafeedId datafeedName description date totalCount feedMode } } }");
          console.log("== listItemFeeds", JSON.stringify(feeds).slice(0, 1200));
          const f0 = feeds.data?.listItemFeeds?.feeds?.[0];
          if (f0) { const d = await chamar(`{ getItemFeedData(datafeedId: ${JSON.stringify(f0.datafeedId)}, limit: 2) { rows { columns updateType } pageInfo { totalCount hasMore } } }`); console.log("== feedData", JSON.stringify(d).slice(0, 1500)); }
          await sql.end();
          JS
          REMOTO

name: Diagnóstico esquema completo afiliados (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-afiliados-esquema.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Esquema completo e amostras sem dados pessoais
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          import { createDecipheriv, createHash } from "node:crypto";
          const sql = postgres(process.env.DATABASE_URL);
          const rows = await sql`select chave, valor, secreto from configuracoes where chave in ('afiliados.appId','afiliados.secret')`;
          const key = createHash("sha256").update(process.env.ENCRYPTION_KEY).digest();
          const dec = (v) => { const [, iv, tag, data] = v.split(":"); const d = createDecipheriv("aes-256-gcm", key, Buffer.from(iv, "base64")); d.setAuthTag(Buffer.from(tag, "base64")); return Buffer.concat([d.update(Buffer.from(data, "base64")), d.final()]).toString("utf8"); };
          const cfg = Object.fromEntries(rows.map((r) => [r.chave, r.secreto ? dec(r.valor) : r.valor]));
          const chamar = async (query) => {
            const corpo = JSON.stringify({ query }); const ts = Math.floor(Date.now() / 1000);
            const sig = createHash("sha256").update(`${cfg["afiliados.appId"]}${ts}${corpo}${cfg["afiliados.secret"]}`).digest("hex");
            const r = await fetch("https://open-api.affiliate.shopee.com.br/graphql", { method: "POST", headers: { "Content-Type": "application/json", Authorization: `SHA256 Credential=${cfg["afiliados.appId"]}, Timestamp=${ts}, Signature=${sig}` }, body: corpo });
            return r.json().catch(async () => ({ texto: await r.text() }));
          };
          const tipo = (t) => t ? (t.kind === "NON_NULL" ? tipo(t.ofType) + "!" : t.kind === "LIST" ? "[" + tipo(t.ofType) + "]" : t.name) : "?";
          const T = "{ kind name ofType { kind name ofType { kind name ofType { kind name } } } }";
          const esq = await chamar(`{ __schema { queryType { name } mutationType { name } types { kind name description fields { name description args { name type ${T} } type ${T} } inputFields { name type ${T} } enumValues { name } } } }`);
          if (esq.errors) console.log("ERRO esquema", JSON.stringify(esq.errors));
          for (const t of esq.data?.__schema?.types ?? []) {
            if (t.name.startsWith("__") || t.kind === "SCALAR") continue;
            console.log(`\n## ${t.kind} ${t.name}${t.description ? " — " + t.description.replace(/\s+/g, " ").slice(0, 200) : ""}`);
            for (const f of t.fields ?? []) console.log(`  ${f.name}${f.args?.length ? "(" + f.args.map((a) => a.name + ": " + tipo(a.type)).join(", ") + ")" : ""}: ${tipo(f.type)}${f.description ? "  // " + f.description.replace(/\s+/g, " ").slice(0, 160) : ""}`);
            for (const f of t.inputFields ?? []) console.log(`  in ${f.name}: ${tipo(f.type)}`);
            if (t.enumValues?.length) console.log("  enum:", t.enumValues.map((e) => e.name).join(","));
          }
          // Amostras (sem dados de compradores): feeds de produto
          const feeds = await chamar("{ listItemFeeds { nodes { datafeedId datafeedName description date totalCount feedMode } } }");
          console.log("\n== listItemFeeds", JSON.stringify(feeds).slice(0, 1500));
          await sql.end();
          JS
          REMOTO

name: Diagnóstico vídeo de produto da Shopee (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-shpvid.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: De onde sai o vídeo da Shopee
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module <<'JS'
          const UA = "Mozilla/5.0 (Linux; Android 14; SM-S918B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36";
          const r0 = await fetch("https://s.shopee.com.br/", { redirect: "manual", headers: { "User-Agent": UA } }).catch(() => null);
          console.log("curto raiz", r0?.status);
          const t = await (await fetch("https://shopee.com.br/product/1038979631/22897894589", { headers: { "User-Agent": UA } })).text();
          let i = t.indexOf("video_info");
          console.log("VIDEO_INFO", i, t.slice(Math.max(0, i - 50), i + 1800).replace(/\s+/g, " "));
          const j = t.indexOf("video_info", i + 3000);
          console.log("VIDEO_INFO 2", j, j > 0 ? t.slice(j - 50, j + 600).replace(/\s+/g, " ") : "");
          console.log("TITLE", (t.match(/<title[^>]*>([^<]+)/) ?? [])[1]);
          console.log("OG", (t.match(/<meta[^>]+og:(?:title|description|image)[^>]+>/g) ?? []).slice(0, 4).join(" "));
          console.log("DESC", (t.match(/"description":"([^"]{0,300})/) ?? [])[1]);
          const v = (t.match(/https:\\?\/\\?\/[^"]+?vod\.susercontent\.com[^"]+/g) ?? []).map((u) => u.replace(/\\\//g, "/"));
          console.log("URLS", [...new Set(v)].slice(0, 8).join("\n"));
          for (const u of [...new Set(v)].slice(0, 3)) { const r = await fetch(u, { method: "HEAD", headers: { "User-Agent": UA } }).catch(() => null); console.log("HEAD", r?.status, r?.headers.get("content-type"), r?.headers.get("content-length"), u.slice(0, 100)); }
          JS
          REMOTO

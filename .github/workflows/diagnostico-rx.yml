name: Diagnóstico raio-x (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-rx.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Raio-X real
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose logs --since 12m app 2>&1 | grep -iE "raio-x|contagem-anuncios" | tail -5 | cut -c1-220
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          const sql = postgres(process.env.DATABASE_URL);
          console.log("RX", JSON.stringify(await sql`select marketplace, count(*)::int n, count(visitas)::int com_visitas, sum(visitas)::int visitas, sum(vendas30)::int vendas30, sum(vendas_total)::int vendas_total, count(qualidade)::int com_qualidade, round(avg((qualidade->>'nota')::int))::int nota, max(atualizado_em) em from raiox_anuncios group by 1`));
          for (const r of await sql`select marketplace, left(titulo, 40) t, visitas, vendas30, vendas_total, fotos, premium, frete_gratis, qualidade->>'nota' nota, jsonb_array_length(coalesce(qualidade->'acoes','[]')) acoes from raiox_anuncios order by visitas desc nulls last limit 6`) console.log("TOP", JSON.stringify(r));
          await sql.end();
          JS
          REMOTO

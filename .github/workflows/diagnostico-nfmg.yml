name: Diagnóstico nota Magalu (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-nfmg.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Situação da nota no Magalu
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          import { createDecipheriv, createHash } from "node:crypto";
          const sql = postgres(process.env.DATABASE_URL);
          const key = createHash("sha256").update(process.env.ENCRYPTION_KEY).digest();
          const dec = (v) => { const [, iv, tag, data] = v.split(":"); const d = createDecipheriv("aes-256-gcm", key, Buffer.from(iv, "base64")); d.setAuthTag(Buffer.from(tag, "base64")); return Buffer.concat([d.update(Buffer.from(data, "base64")), d.final()]).toString("utf8"); };
          const ns = await sql`select n.numero, n.status, n.total_produtos, n.frete, n.desconto, n.total_nota, n.envio_marketplace, n.emitida_em, n.autorizada_em, length(n.xml_proc) as tam, p.id_externo, p.total, p.status as pst from notas n join pedidos_marketplace p on p.nota_id = n.id where p.marketplace = 'magalu' order by n.criado_em desc limit 4`;
          for (const n of ns) console.log("NOTA", JSON.stringify(n));
          const ult = await sql`select n.numero, n.xml_proc from notas n join pedidos_marketplace p on p.nota_id = n.id where p.id_externo = '1585170111042115' limit 1`;
          const x = ult[0]?.xml_proc ?? "";
          const t = (k) => [...x.matchAll(new RegExp(`<${k}>([^<]*)</${k}>`, "g"))].map((m) => m[1]).join("|");
          console.log("XML", "vProd", t("vProd"), "vFrete", t("vFrete"), "vDesc", t("vDesc"), "vNF", t("vNF"), "vPag", t("vPag"), "modFrete", t("modFrete"), "CFOP", t("CFOP"), "tPag", t("tPag"), "começa", x.slice(0, 60));
          const [m] = await sql`select access_token_enc from contas_marketplace where marketplace = 'magalu' limit 1`;
          const tm = dec(m.access_token_enc);
          const g = async (p) => { const r = await fetch("https://api.magalu.com" + p, { headers: { Authorization: `Bearer ${tm}`, Accept: "application/json" } }); return [r.status, await r.json().catch(() => null)]; };
          for (const d of ["4da3509c-4c8b-4104-b654-ad276fb29b16", "e9006307-e9a7-4005-983c-d3ac5a0ccff4"]) {
            const [s, j] = await g(`/seller/v1/deliveries/${d}/invoices`);
            console.log("INVOICES", d.slice(0, 8), s, JSON.stringify((j?.results ?? []).map((n) => ({ ...n, xml: n.xml ? `(${n.xml.length} chars)` : undefined }))).slice(0, 1500));
            const [s2, e] = await g(`/seller/v1/deliveries/${d}`);
            console.log("DELIVERY", d.slice(0, 8), s2, e?.status, JSON.stringify(e?.invoices ?? null).slice(0, 600));
          }
          await sql.end();
          JS
          REMOTO

name: Diagnóstico busca de modelos 3D (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-modelos.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: O servidor consegue pesquisar nos sites de modelos?
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module </dev/null -e '
          const ua = { "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36", Accept: "application/json" };
          for (const q of ["suporte placa de video", "gpu support"]) {
            const r = await fetch("https://makerworld.com/api/v1/search-service/select/design2?keyword=" + encodeURIComponent(q) + "&limit=3&offset=0", { headers: ua }).catch((e) => ({ status: "falhou " + e.cause?.code }));
            const t = r.text ? await r.text() : "";
            console.log("MakerWorld", q, r.status, t.slice(0, 1) === "{" ? "json total=" + JSON.parse(t).total : "nao-json " + (/just a moment/i.test(t) ? "(cloudflare)" : t.slice(0, 40).replace(/\s+/g, " ")));
            const p = await fetch("https://api.printables.com/graphql/", { method: "POST", headers: { ...ua, "Content-Type": "application/json" }, body: JSON.stringify({ query: "query($q:String!){searchPrints2(query:$q,limit:3){items{name}}}", variables: { q } }) }).catch((e) => ({ status: "falhou " + e.cause?.code }));
            const pt = p.text ? await p.text() : "";
            console.log("Printables", q, p.status, pt.slice(0, 1) === "{" ? "itens=" + (JSON.parse(pt).data?.searchPrints2?.items?.length ?? "erro") : "nao-json " + (/just a moment/i.test(pt) ? "(cloudflare)" : ""));
          }
          const d = await fetch("https://makerworld.com/api/v1/design-service/design/22508", { headers: ua }).catch(() => ({ status: "falhou" }));
          console.log("MakerWorld leitura modelo", d.status);
          '
          REMOTO

name: Deploy do aplicativo (VM)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-deploy.yml"
  pull_request:
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: verificar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER || 'root' }}
      VM_PORT: ${{ secrets.VM_PORT || '22' }}
      SSHPASS: ${{ secrets.VM_PSW }}
      VM_DIR: ${{ vars.VM_APP_DIR || '/opt/arvirtual-app' }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN || 'app.arvirtual.com.br' }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir acesso à VM
        run: |
          [ -n "$VM_HOST" ] || { echo "::error::Cadastre o secret VM_HOST (IP da VM)"; exit 1; }
          [ -n "$SSHPASS" ] || { echo "::error::Cadastre o secret VM_PSW (senha do usuário da VM)"; exit 1; }
          sudo apt-get install -y -qq sshpass >/dev/null
          echo "SSH=sshpass -e ssh -p $VM_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 $VM_USER@$VM_HOST" >> "$GITHUB_ENV"

      # A VM é compartilhada com outro sistema: este deploy só mexe no projeto Docker
      # "arvirtual-app" e na pasta $VM_DIR. Não altera firewall, portas nem outros containers.
      - name: Preparar a VM (Docker e rsync, se faltarem)
        run: |
          $SSH "bash -s" <<'REMOTO'
          set -e
          if ! command -v docker >/dev/null || ! command -v rsync >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            (apt-get update -qq && apt-get install -y -qq rsync curl ca-certificates) >/dev/null 2>&1
            command -v docker >/dev/null || curl -fsSL https://get.docker.com | sh
          fi
          docker compose version >/dev/null
          echo "VM pronta: $(docker --version)"
          REMOTO

      - name: Gerar app/.env (mantém as chaves já criadas na VM)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.APP_GEMINI }}
          APICPF_CHAVE: ${{ secrets.APICPF_CHAVE }}
          ADMIN_NAME: ${{ vars.ADMIN_NAME || 'Kleber Metzger de Farias' }}
        run: |
          $SSH "cat '$VM_DIR/.env' 2>/dev/null || true" > atual.env
          python3 - <<'PY'
          import base64, os, re, secrets
          from urllib.parse import quote
          atual = {}
          for linha in open("atual.env"):
              m = re.match(r"^(\w+)='(.*)'$", linha.strip())
              if m: atual[m[1]] = m[2]
          env = os.environ
          def valor(k, gerar=None):
              # Ordem: secret do GitHub > valor já salvo na VM > gerado agora (e salvo na VM).
              return env.get(k) or atual.get(k) or (gerar() if gerar else "")
          novo = lambda: secrets.token_urlsafe(36)
          pg = valor("POSTGRES_PASSWORD", lambda: secrets.token_urlsafe(18))
          admin_senha = valor("ADMIN_PASSWORD") or env["SSHPASS"]
          v = {
              "POSTGRES_PASSWORD": pg,
              "DATABASE_URL": f"postgres://arvirtual:{quote(pg, safe='')}@arvirtual-db:5432/arvirtual",
              "AUTH_SECRET": valor("AUTH_SECRET", novo),
              "ENCRYPTION_KEY": valor("ENCRYPTION_KEY", novo),
              "APP_DOMAIN": env["APP_DOMAIN"],
              "APP_URL": f"https://{env['APP_DOMAIN']}",
              "ADMIN_NAME": env["ADMIN_NAME"],
              "ADMIN_EMAIL": valor("ADMIN_EMAIL") or "kleber@arvirtual.com.br",
              "ADMIN_PASSWORD": admin_senha,
              "GEMINI_API_KEY": valor("GEMINI_API_KEY").strip(),
              "APICPF_CHAVE": valor("APICPF_CHAVE").strip(),
              # Fixa os IDs das Server Actions entre deploys (gerada uma vez e mantida na VM).
              "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY": valor("NEXT_SERVER_ACTIONS_ENCRYPTION_KEY", lambda: base64.b64encode(secrets.token_bytes(32)).decode()),
          }
          with open("app/.env", "w") as f:
              for k, val in v.items():
                  if "'" in val or "\n" in val:
                      raise SystemExit(f"{k} não pode conter aspas simples nem quebra de linha")
                  f.write(f"{k}='{val}'\n")
          PY
          chmod 600 app/.env && rm -f atual.env

      - name: Enviar arquivos para a VM
        run: |
          $SSH "mkdir -p '$VM_DIR'"
          rsync -az --delete \
            --exclude node_modules --exclude .next --exclude /uploads --exclude .env.local \
            -e "sshpass -e ssh -p $VM_PORT -o StrictHostKeyChecking=accept-new" \
            app/ "$VM_USER@$VM_HOST:$VM_DIR/"
          $SSH "chmod 600 '$VM_DIR/.env'"

      - name: Conferir a rede do proxy
        run: |
          $SSH "docker network inspect farias-contabil_default >/dev/null" || {
            echo "::error::Rede farias-contabil_default não encontrada: o Caddy da VM precisa estar rodando."; exit 1; }

      # A imagem é montada aqui no GitHub e só carregada na VM: o build do Next.js pesa (CPU e disco)
      # e a VM é compartilhada com o outro sistema.
      - name: Montar a imagem
        run: |
          grep '^NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=' app/.env | cut -d= -f2- | tr -d "'" > "$RUNNER_TEMP/actions_key"
          [ -s "$RUNNER_TEMP/actions_key" ] || { echo "::error::Chave das Server Actions ausente no .env"; exit 1; }
          DOCKER_BUILDKIT=1 docker build --secret id=actions_key,src="$RUNNER_TEMP/actions_key" \
            --build-arg DEPLOY_ID="${GITHUB_SHA::12}" -t arvirtual-app:latest app
          rm -f "$RUNNER_TEMP/actions_key"

      - name: Enviar a imagem para a VM
        run: docker save arvirtual-app:latest | gzip -1 | $SSH "gunzip | docker load"

      - name: Subir containers
        run: $SSH "cd '$VM_DIR' && docker compose up -d --no-build --remove-orphans && docker image prune -f --filter label=app=arvirtual-app"

      - name: Checar o app na VM
        run: |
          for i in $(seq 1 30); do
            if $SSH "cd '$VM_DIR' && docker compose exec -T app wget -qO- http://127.0.0.1:3000/api/health" 2>/dev/null; then
              echo; echo "App rodando na VM."; break
            fi
            [ "$i" = 30 ] && { $SSH "cd '$VM_DIR' && docker compose ps && docker compose logs --tail 80 app"; exit 1; }
            sleep 10
          done

      - name: Checar https://app.arvirtual.com.br
        run: |
          for i in $(seq 1 12); do
            curl -fsS -m 10 "https://$APP_DOMAIN/api/health" && { echo; echo "No ar: https://$APP_DOMAIN"; exit 0; }
            sleep 10
          done
          echo "::warning::O app roda na VM, mas https://$APP_DOMAIN ainda não respondeu (o Caddy da VM precisa ter o bloco app.arvirtual.com.br)."

name: Diagnóstico Threads no servidor (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-threads.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Abre o post com os cookies salvos (sem mostrar valores)
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          import { createDecipheriv, createHash } from "node:crypto";
          const sql = postgres(process.env.DATABASE_URL);
          const [row] = await sql`select valor, secreto from configuracoes where chave = 'videos.cookies'`;
          if (!row) { console.log("sem cookies salvos"); process.exit(0); }
          const key = createHash("sha256").update(process.env.ENCRYPTION_KEY).digest();
          const dec = (v) => { const [, iv, tag, data] = v.split(":"); const d = createDecipheriv("aes-256-gcm", key, Buffer.from(iv, "base64")); d.setAuthTag(Buffer.from(tag, "base64")); return Buffer.concat([d.update(Buffer.from(data, "base64")), d.final()]).toString("utf8"); };
          const txt = row.secreto ? dec(row.valor) : row.valor;
          const linhas = txt.split(/\r?\n/).map((l) => l.replace(/^#HttpOnly_/, "").split("\t")).filter((c) => c.length >= 7);
          const th = linhas.filter((c) => c[0].toLowerCase().replace(/^\./, "").endsWith("threads.com"));
          console.log("linhas de cookie:", linhas.length, "threads.com:", th.length, "nomes:", th.map((c) => c[5]).join(","));
          const cookie = th.map((c) => `${c[5]}=${c[6].trim()}`).join("; ");
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36";
          const r = await fetch("https://www.threads.com/@_mamaeindica.oficial/post/DfLCydgDNhb", { headers: { "User-Agent": UA, Cookie: cookie, "Accept-Language": "pt-BR,pt;q=0.9", Accept: "text/html,application/xhtml+xml", "Sec-Fetch-Mode": "navigate", "Sec-Fetch-Site": "none", "Sec-Fetch-Dest": "document" } });
          const html = await r.text();
          const pos = html.indexOf('"code":"DfLCydgDNhb"');
          const vv = [...html.matchAll(/"video_versions":(\[[^\]]*\])/g)];
          console.log("status", r.status, "tamanho", html.length, "code em", pos, "video_versions", vv.length);
          if (vv.length) { const v = vv.sort((a, b) => Math.abs(a.index - pos) - Math.abs(b.index - pos))[0]; const u = JSON.parse(v[1])[0].url; const rv = await fetch(u, { headers: { "User-Agent": UA } }); const b = await rv.arrayBuffer(); console.log("video", rv.status, rv.headers.get("content-type"), b.byteLength, "bytes"); }
          await sql.end();
          JS
          REMOTO

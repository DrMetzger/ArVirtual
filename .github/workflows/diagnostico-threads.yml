name: Diagnóstico Threads no servidor (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-threads.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Link de compartilhar com os cookies salvos (sem mostrar valores)
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          import { createDecipheriv, createHash } from "node:crypto";
          const sql = postgres(process.env.DATABASE_URL);
          const [row] = await sql`select valor, secreto from configuracoes where chave = 'videos.cookies'`;
          const key = createHash("sha256").update(process.env.ENCRYPTION_KEY).digest();
          const dec = (v) => { const [, iv, tag, data] = v.split(":"); const d = createDecipheriv("aes-256-gcm", key, Buffer.from(iv, "base64")); d.setAuthTag(Buffer.from(tag, "base64")); return Buffer.concat([d.update(Buffer.from(data, "base64")), d.final()]).toString("utf8"); };
          const txt = row.secreto ? dec(row.valor) : row.valor;
          const cookie = txt.split(/\r?\n/).map((l) => l.replace(/^#HttpOnly_/, "").split("\t")).filter((c) => c.length >= 7 && c[0].toLowerCase().replace(/^\./, "").endsWith("threads.com")).map((c) => `${c[5]}=${c[6].trim()}`).join("; ");
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36";
          const abrir = (u) => fetch(u, { headers: { "User-Agent": UA, Cookie: cookie, "Accept-Language": "pt-BR,pt;q=0.9", Accept: "text/html,application/xhtml+xml", "Sec-Fetch-Mode": "navigate", "Sec-Fetch-Site": "none", "Sec-Fetch-Dest": "document" } }).then((r) => r.text());
          const h = await abrir("https://www.threads.com/share/BALuSSFHHh/");
          const real = (h.match(/<meta property="(?:al:android:url|og:url)" content="([^"]+\/post\/[\w-]+)/)?.[1] ?? "").replace(/&#064;/g, "@");
          console.log("share resolve para:", real);
          const h2 = await abrir("https://www.threads.com/@beatrizandrade37_/post/DeIQGxlka_m");
          console.log("beatriz: code", h2.indexOf('"code":"DeIQGxlka_m"') > 0, "video_versions", (h2.match(/"video_versions"/g) ?? []).length);
          await sql.end();
          JS
          REMOTO

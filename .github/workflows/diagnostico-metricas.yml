name: Diagnóstico métricas e taxas (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-metricas.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Visualizações e taxas (só nomes de campos e números)
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          import { createDecipheriv, createHash, createHmac } from "node:crypto";
          const sql = postgres(process.env.DATABASE_URL);
          const key = createHash("sha256").update(process.env.ENCRYPTION_KEY).digest();
          const dec = (v) => { const [, iv, tag, data] = v.split(":"); const d = createDecipheriv("aes-256-gcm", key, Buffer.from(iv, "base64")); d.setAuthTag(Buffer.from(tag, "base64")); return Buffer.concat([d.update(Buffer.from(data, "base64")), d.final()]).toString("utf8"); };
          const cfg = Object.fromEntries((await sql`select chave, valor, secreto from configuracoes where chave like 'shopee.%'`).map((r) => [r.chave, r.secreto ? dec(r.valor) : r.valor]));
          const contas = await sql`select id, marketplace, id_externo, access_token_enc, expira_em from contas_marketplace`;
          const tok = (m) => { const c = contas.find((x) => x.marketplace === m); return c && { ...c, token: dec(c.access_token_enc) }; };
          const anuncios = await sql`select marketplace, id_externo from anuncios where status = 'publicado' and id_externo is not null`;
          const ids = (m) => anuncios.filter((a) => a.marketplace === m).map((a) => a.id_externo);
          // só números e nomes de campos (nada de texto livre)
          const numeros = (o, pre = "", out = [], prof = 0) => { if (prof > 5 || !o || typeof o !== "object") return out; for (const [k, v] of Object.entries(o)) { const p = pre ? `${pre}.${k}` : k; if (typeof v === "number") out.push(`${p}=${v}`); else if (v && typeof v === "object") numeros(Array.isArray(v) ? v[0] : v, p + (Array.isArray(v) ? "[0]" : ""), out, prof + 1); } return out; };
          const filtra = (arr) => arr.filter((s) => /fee|commission|tax|tarif|comis|cost|freight|frete|shipping|income|amount|price|total|view|visit|click|like|discount|rebate|voucher/i.test(s));

          // ---------- Mercado Livre ----------
          const ml = tok("mercadolivre");
          if (ml) {
            const g = async (p) => { const r = await fetch("https://api.mercadolibre.com" + p, { headers: { Authorization: `Bearer ${ml.token}` } }); return [r.status, await r.json().catch(() => null)]; };
            const mid = ids("mercadolivre").slice(0, 5);
            console.log("== ML anuncios", mid.length, "token expira", ml.expira_em);
            if (mid.length) { const [s, v] = await g(`/visits/items?ids=${mid.join(",")}`); console.log("ML visits/items", s, JSON.stringify(v).slice(0, 300)); const [s2, v2] = await g(`/items/${mid[0]}/visits/time_window?last=30&unit=day`); console.log("ML time_window", s2, "total", v2?.total_visits, "keys", Object.keys(v2 ?? {}).join(",")); }
            const [o] = await sql`select dados from pedidos_marketplace where marketplace = 'mercadolivre' order by data desc limit 1`;
            if (o) { console.log("ML pedido campos:", filtra(numeros(o.dados)).join(" ")); const sh = o.dados?.shipping?.id; if (sh) { const [s3, c] = await g(`/shipments/${sh}/costs`); console.log("ML shipments costs", s3, filtra(numeros(c)).join(" ")); } }
          }
          // ---------- Shopee ----------
          const sp = tok("shopee");
          if (sp) {
            const host = cfg["shopee.ambiente"] === "sandbox" ? "https://partner.test-stable.shopeemobile.com" : "https://partner.shopeemobile.com";
            const call = async (path, query = {}, body) => { const ts = Math.floor(Date.now() / 1000); const sign = createHmac("sha256", cfg["shopee.partnerKey"]).update(`${cfg["shopee.partnerId"]}${path}${ts}${sp.token}${sp.id_externo}`).digest("hex"); const q = new URLSearchParams({ partner_id: cfg["shopee.partnerId"], timestamp: String(ts), access_token: sp.token, shop_id: sp.id_externo, sign, ...query }); const r = await fetch(`${host}${path}?${q}`, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined }); return r.json(); };
            const sid = ids("shopee").slice(0, 10);
            console.log("== Shopee anuncios", sid.length, "token expira", sp.expira_em);
            if (sid.length) { const r = await call("/api/v2/product/get_item_extra_info", { item_id_list: sid.join(",") }); console.log("Shopee extra_info", r.error || "ok", JSON.stringify(r.response ?? r.message).slice(0, 600)); }
            const [o] = await sql`select id_externo from pedidos_marketplace where marketplace = 'shopee' order by data desc limit 1`;
            if (o) { const r = await call("/api/v2/payment/get_escrow_detail", { order_sn: o.id_externo }); console.log("Shopee escrow", r.error || "ok", filtra(numeros(r.response?.order_income ?? r)).join(" ").slice(0, 1500)); }
          }
          // ---------- Magalu ----------
          const [mo] = await sql`select dados from pedidos_marketplace where marketplace = 'magalu' order by data desc limit 1`;
          if (mo) console.log("== Magalu pedido campos:", filtra(numeros(mo.dados)).join(" ").slice(0, 1500));
          const mg = tok("magalu");
          if (mg && mo) { const id = mo.dados?.id ?? mo.dados?.code; for (const p of [`/seller/v1/orders/${id}/fees`, `/seller/v1/orders/${id}/commissions`, `/seller/v1/financial/statements?_limit=1`]) { const r = await fetch("https://api.magalu.com" + p, { headers: { Authorization: `Bearer ${mg.token}`, Accept: "application/json" } }); const t = await r.text(); let j; try { j = JSON.parse(t); } catch {} console.log("Magalu", p.replace(String(id), ":id"), r.status, j ? filtra(numeros(j)).join(" ").slice(0, 400) : t.slice(0, 120)); } }
          await sql.end();
          JS
          REMOTO

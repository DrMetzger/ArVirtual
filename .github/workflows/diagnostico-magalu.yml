name: Diagnóstico Magalu SKU (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-magalu.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Status dos SKUs SUP-PS5001 e SUP-PS5001-C (só GET)
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -A -F " | "' <<'SQL'
          select sku, length(nome) nome_len, ncm, gtin, peso_g, altura_cm, largura_cm, comprimento_cm, origem, estoque, ativo, tem_variacoes, array_length(imagens,1) imgs,
            (select string_agg(right(i, 5), ',') from unnest(imagens) i) ext_imgs, length(descricao) desc_len, material, cor, atributos
          from produtos where sku in ('ENF-PAP001','SUP-PS5001','SUP-PS5001-C');
          select p.sku, c.marketplace, a.status, a.id_externo, left(a.mensagem, 120), a.criado_em from anuncios a join produtos p on p.id = a.produto_id join contas_marketplace c on c.id = a.conta_id
          where p.sku in ('ENF-PAP001','SUP-PS5001','SUP-PS5001-C') order by a.criado_em;
          SQL
          docker compose logs --since 2h app 2>&1 | grep -iE "magalu" | tail -10
          REMOTO

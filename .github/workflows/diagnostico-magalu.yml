name: Diagnóstico Magalu SKU (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-magalu.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Status e validação do SKU ENF-PAP001 (só GET)
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          import { createDecipheriv, createHash } from "node:crypto";
          const sql = postgres(process.env.DATABASE_URL);
          const [c] = await sql`select access_token_enc, expira_em from contas_marketplace where marketplace = 'magalu' limit 1`;
          const key = createHash("sha256").update(process.env.ENCRYPTION_KEY).digest();
          const [, iv, tag, data] = c.access_token_enc.split(":");
          const d = createDecipheriv("aes-256-gcm", key, Buffer.from(iv, "base64")); d.setAuthTag(Buffer.from(tag, "base64"));
          const token = Buffer.concat([d.update(Buffer.from(data, "base64")), d.final()]).toString("utf8");
          console.log("token expira:", c.expira_em);
          const get = async (p) => { const r = await fetch("https://api.magalu.com" + p, { headers: { Authorization: "Bearer " + token, Accept: "application/json" } }); return [r.status, await r.text()]; };
          for (const p of ["/seller/v1/portfolios/skus/ENF-PAP001", "/seller/v1/portfolios/skus/ENF-PAP001/validation-info"]) {
            const [st, txt] = await get(p);
            let j; try { j = JSON.parse(txt); } catch { j = txt; }
            if (j && typeof j === "object" && !Array.isArray(j)) { delete j.description; if (j.images) j.images = `${j.images.length} imagem(ns)`; }
            console.log("==", p, st); console.log(JSON.stringify(j, null, 1).slice(0, 3000));
          }
          await sql.end();
          JS
          REMOTO

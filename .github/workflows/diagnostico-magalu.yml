name: Diagnóstico Magalu regulatório (corrige campos regulatórios)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-magalu.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Campos regulatórios e relevância
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module </dev/null -e '
          import { createHmac } from "node:crypto";
          const k = createHmac("sha256", process.env.AUTH_SECRET).update("rotas-internas").digest("hex");
          const r = await fetch("http://localhost:3000/api/interno/magalu-regulatorio?ver=1&raiox=1", { method: "POST", headers: { "x-chave-interna": k } });
          const j = await r.json().catch(() => null);
          const todos = Object.values(j?.regulatorio ?? {}).flatMap((c) => Object.values(c));
          console.log(r.status, "skus", todos.length, "alterados", todos.filter((x) => x.alterado === true).length, "falhas", JSON.stringify(todos.filter((x) => x.erro || (x.alterado && x.alterado !== true)).map((x) => x.erro || x.alterado)).slice(0, 800), "faltando", todos.filter((x) => x.faltam?.length).length);
          console.log("raiox", JSON.stringify(j?.raiox));
          '
          REMOTO

name: Diagnóstico link curto da Shopee (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-shplink.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Para onde vai o link curto
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          const sql = postgres(process.env.DATABASE_URL);
          // Um link curto que o próprio garimpo já gerou (se houver) ou o link de produto de um item garimpado.
          const [p] = await sql`select link_afiliado from afiliados_produtos where link_afiliado like '%s.shopee%' order by id desc limit 1`.catch(() => [undefined]);
          const curto = p?.link_afiliado;
          console.log("TEM CURTO", Boolean(curto));
          const UAs = { celular: "Mozilla/5.0 (Linux; Android 14; SM-S918B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36", pc: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36", ytdlp: "Mozilla/5.0 (X11; Linux x86_64; rv:109.0) Gecko/20100101 Firefox/115.0" };
          if (curto) for (const [nome, ua] of Object.entries(UAs)) {
            let u = curto; const passos = [];
            for (let i = 0; i < 8; i++) {
              const r = await fetch(u, { redirect: "manual", headers: { "User-Agent": ua } }).catch(() => null);
              if (!r) { passos.push("ERRO"); break; }
              const loc = r.headers.get("location");
              const host = new URL(u).host;
              passos.push(`${r.status} ${host}${new URL(u).pathname.slice(0, 40)}`);
              if (!loc) { const t = await r.text(); const m = t.match(/(?:opaanlp|product)(?:\/|%2F)(\d+)(?:\/|%2F)(\d+)|-i\.(\d+)\.(\d+)/); passos.push(`corpo ${t.length} acha_ids=${Boolean(m)} ${m ? m[0] : ""} trecho=${t.replace(/\s+/g, " ").replace(/https?:\/\/[^"' ]+/g, (x) => new URL(x).host + new URL(x).pathname.slice(0, 50)).slice(0, 200)}`); break; }
              u = new URL(loc, u).toString();
            }
            console.log("UA", nome, "|", passos.join(" -> "));
          }
          await sql.end();
          JS
          REMOTO

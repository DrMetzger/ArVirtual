name: Diagnóstico campos da API de afiliados (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-campos.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Campos da API
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          import { createDecipheriv, createHash } from "node:crypto";
          const sql = postgres(process.env.DATABASE_URL);
          const key = createHash("sha256").update(process.env.ENCRYPTION_KEY).digest();
          const dec = (v) => { const [, iv, tag, data] = v.split(":"); const d = createDecipheriv("aes-256-gcm", key, Buffer.from(iv, "base64")); d.setAuthTag(Buffer.from(tag, "base64")); return Buffer.concat([d.update(Buffer.from(data, "base64")), d.final()]).toString("utf8"); };
          const cfg = Object.fromEntries((await sql`select chave, valor, secreto from configuracoes where chave like 'afiliados.%'`).map((r) => [r.chave, r.secreto ? dec(r.valor) : r.valor]));
          const af = async (query) => { for (let i = 0; i < 4; i++) { const corpo = JSON.stringify({ query }); const ts = Math.floor(Date.now() / 1000); const sig = createHash("sha256").update(`${cfg["afiliados.appId"]}${ts}${corpo}${cfg["afiliados.secret"]}`).digest("hex"); const r = await fetch("https://open-api.affiliate.shopee.com.br/graphql", { method: "POST", headers: { "Content-Type": "application/json", Authorization: `SHA256 Credential=${cfg["afiliados.appId"]}, Timestamp=${ts}, Signature=${sig}` }, body: corpo }); const j = await r.json(); if (!JSON.stringify(j.errors ?? "").includes("10000")) return j; await new Promise((ok) => setTimeout(ok, 1000)); } return null; };
          let j = await af(`{ __schema { queryType { fields { name args { name type { name kind ofType { name } } } } } } }`);
          for (const f of j?.data?.__schema?.queryType?.fields ?? []) console.log("QUERY", f.name, "(", f.args.map((a) => `${a.name}:${a.type.name ?? a.type.ofType?.name}`).join(", "), ")");
          if (!j?.data) console.log("SCHEMA erro", JSON.stringify(j).slice(0, 300));
          for (const t of ["ProductOfferV2", "ProductOfferConnectionV2", "ShopOfferV2", "ShopeeOfferV2"]) {
            j = await af(`{ __type(name: "${t}") { fields { name type { name kind ofType { name } } } } }`);
            console.log("TYPE", t, (j?.data?.__type?.fields ?? []).map((f) => `${f.name}:${f.type.name ?? f.type.ofType?.name}`).join(" "), j?.data ? "" : JSON.stringify(j).slice(0, 200));
          }
          await sql.end();
          JS
          REMOTO

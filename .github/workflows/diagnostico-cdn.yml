name: Diagnóstico CDN de fotos (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-cdn.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: O servidor baixa fotos dos CDNs?
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          import { createDecipheriv, createHash } from "node:crypto";
          const sql = postgres(process.env.DATABASE_URL);
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36";
          const key = createHash("sha256").update(process.env.ENCRYPTION_KEY).digest();
          const dec = (v) => { const [, iv, tag, data] = v.split(":"); const d = createDecipheriv("aes-256-gcm", key, Buffer.from(iv, "base64")); d.setAuthTag(Buffer.from(tag, "base64")); return Buffer.concat([d.update(Buffer.from(data, "base64")), d.final()]).toString("utf8"); };
          const [c] = await sql`select access_token_enc from contas_marketplace where marketplace = 'mercadolivre' limit 1`;
          const p = await (await fetch("https://api.mercadolibre.com/products/MLB54153222", { headers: { Authorization: `Bearer ${dec(c.access_token_enc)}` } })).json();
          const urls = (p.pictures ?? []).slice(0, 2).map((x) => x.url);
          console.log("fotos reais ML:", urls.length);
          if (urls[0]) urls.push(urls[0].replace(/-[A-Z]\.(webp|jpg)/, "-F.$1"));
          for (const u of urls) { const r = await fetch(u, { headers: { "User-Agent": UA }, signal: AbortSignal.timeout(20000) }).catch((e) => ({ status: e.message })); const tam = r.arrayBuffer ? (await r.arrayBuffer()).byteLength : 0; console.log(r.status, r.headers?.get?.("content-type"), tam, "bytes", u.slice(0, 90)); }
          await sql.end();
          JS
          REMOTO

name: Diagnóstico pedido Shopee e push (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-pedshp.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Pedido, push e logs
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose logs --since 30h app 2>&1 | grep -iE "\[push\]|\[sync|shopee|fcm|firebase" | grep -viE "cookie|token=|secret" | tail -25 | cut -c1-220
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          const sql = postgres(process.env.DATABASE_URL);
          const [p] = await sql`select id, status, data, criado_em, atualizado_em, total, conta_id from pedidos_marketplace where id_externo = '2611125P6E4EEW'`;
          console.log("PEDIDO", JSON.stringify(p ?? null));
          const [c] = p ? await sql`select id, ultima_sincronizacao, expira_em from contas_marketplace where id = ${p.conta_id}` : [null];
          console.log("CONTA", JSON.stringify(c ?? null));
          console.log("PUSH config", JSON.stringify(await sql`select chave, length(valor) > 0 as preenchido from configuracoes where chave like 'push.%'`));
          console.log("APARELHOS", JSON.stringify(await sql`select left(id, 6) as id, versao_app, notificacoes, bloqueado, length(push_token) > 0 as tem_token, ultimo_acesso from aparelhos order by ultimo_acesso desc nulls last limit 5`));
          console.log("SHOPEE status recentes", JSON.stringify(await sql`select status, count(*)::int from pedidos_marketplace where marketplace = 'shopee' and data > now() - interval '10 days' group by 1`));
          await sql.end();
          JS
          REMOTO

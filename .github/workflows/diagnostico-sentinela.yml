name: Diagnóstico dados de mercado (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-sentinela.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: O que as APIs entregam
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          import { createDecipheriv, createHash } from "node:crypto";
          const sql = postgres(process.env.DATABASE_URL);
          const key = createHash("sha256").update(process.env.ENCRYPTION_KEY).digest();
          const dec = (v) => { const [, iv, tag, data] = v.split(":"); const d = createDecipheriv("aes-256-gcm", key, Buffer.from(iv, "base64")); d.setAuthTag(Buffer.from(tag, "base64")); return Buffer.concat([d.update(Buffer.from(data, "base64")), d.final()]).toString("utf8"); };
          const cfg = Object.fromEntries((await sql`select chave, valor, secreto from configuracoes where chave like 'afiliados.%'`).map((r) => [r.chave, r.secreto ? dec(r.valor) : r.valor]));
          const af = async (query) => { const corpo = JSON.stringify({ query }); const ts = Math.floor(Date.now() / 1000); const sig = createHash("sha256").update(`${cfg["afiliados.appId"]}${ts}${corpo}${cfg["afiliados.secret"]}`).digest("hex"); const t0 = Date.now(); const r = await fetch("https://open-api.affiliate.shopee.com.br/graphql", { method: "POST", headers: { "Content-Type": "application/json", Authorization: `SHA256 Credential=${cfg["afiliados.appId"]}, Timestamp=${ts}, Signature=${sig}` }, body: corpo }); const j = await r.json(); return [Date.now() - t0, j]; };
          const resumo = (n) => `${String(n.productName).slice(0, 45)} | vendas=${n.sales} preço=${n.priceMin} com=${n.commissionRate} loja=${String(n.shopName).slice(0, 15)} id=${n.itemId}`;
          for (const [rot, args, campos] of [
            ["kw só", `keyword: "suporte"`, "itemId productName sales priceMin commissionRate shopId"],
            ["kw limit 20", `keyword: "suporte", limit: 20`, "itemId sales"],
            ["kw sort 2", `keyword: "suporte", sortType: 2, limit: 20`, "itemId sales"],
            ["kw sort 5", `keyword: "suporte", sortType: 5, limit: 20`, "itemId sales"],
            ["kw acento", `keyword: "impressão 3d", limit: 20`, "itemId sales"],
            ["kw sem acento", `keyword: "impressao 3d", limit: 20`, "itemId sales"],
            ["listType 2 page 2", `listType: 2, limit: 50, page: 2`, "itemId sales productName commissionRate"],
            ["listType 2 sort 5", `listType: 2, sortType: 5, limit: 50`, "itemId sales productName commissionRate"],
            ["listType 0", `listType: 0, limit: 20`, "itemId sales"],
            ["shopOfferV2", null, null],
          ]) {
            const q = args === null ? `{ shopOfferV2(limit: 5) { nodes { shopId shopName commissionRate ratingStar } } }` : `{ productOfferV2(${args}) { nodes { ${campos} } pageInfo { page hasNextPage } } }`;
            const [ms, j] = await af(q);
            const ns = j?.data?.productOfferV2?.nodes ?? j?.data?.shopOfferV2?.nodes ?? [];
            console.log(`SHOPEE ${rot}: ${ms}ms itens=${ns.length} erro=${JSON.stringify(j?.errors?.[0] ?? "")}`);
            if (ns.length) console.log("    ", JSON.stringify(ns.slice(0, 3)).slice(0, 400), "vendas", ns.map((n) => n.sales).slice(0, 15).join(","));
          }
          await sql.end();
          JS
          REMOTO

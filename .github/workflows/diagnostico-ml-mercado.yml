name: Diagnóstico ML pesquisa de mercado (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-ml-mercado.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Endpoints públicos de tendências e mais vendidos (sem dados pessoais)
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          import { createDecipheriv, createHash } from "node:crypto";
          const sql = postgres(process.env.DATABASE_URL);
          const [c] = await sql`select access_token_enc, expira_em from contas_marketplace where marketplace = 'mercadolivre' order by id limit 1`;
          const key = createHash("sha256").update(process.env.ENCRYPTION_KEY).digest();
          const dec = (v) => { const [, iv, tag, data] = v.split(":"); const d = createDecipheriv("aes-256-gcm", key, Buffer.from(iv, "base64")); d.setAuthTag(Buffer.from(tag, "base64")); return Buffer.concat([d.update(Buffer.from(data, "base64")), d.final()]).toString("utf8"); };
          const tk = dec(c.access_token_enc);
          console.log("token expira em", c.expira_em);
          const get = async (p, auth = true) => {
            const r = await fetch("https://api.mercadolibre.com" + p, { headers: auth ? { Authorization: `Bearer ${tk}` } : {} });
            const t = await r.text(); let j; try { j = JSON.parse(t); } catch { j = t; }
            return [r.status, j];
          };
          const show = (n, s, j, len = 900) => console.log(`== ${n} [${s}]`, JSON.stringify(j).slice(0, len));
          const q = encodeURIComponent("enfeite de natal");
          let [s, j] = await get(`/sites/MLB/domain_discovery/search?q=${q}&limit=5`); show("domain_discovery", s, j);
          const cat = Array.isArray(j) && j[0]?.category_id;
          [s, j] = await get(`/trends/MLB`); show("trends geral", s, j, 500);
          if (cat) { [s, j] = await get(`/trends/MLB/${cat}`); show("trends " + cat, s, j, 500); }
          if (cat) { [s, j] = await get(`/categories/${cat}`, false); show("categoria", s, { name: j.name, path: j.path_from_root?.map((x) => x.id + ":" + x.name), total: j.total_items_in_this_category }); }
          let hl;
          if (cat) { [s, hl] = await get(`/highlights/MLB/category/${cat}`); show("highlights " + cat, s, hl, 900); }
          [s, j] = await get(`/sites/MLB/search?q=${q}&limit=3`); show("sites search", s, j, 700);
          [s, j] = await get(`/products/search?site_id=MLB&status=active&q=${q}&limit=3`); show("products search", s, j, 900);
          const itens = (hl?.content ?? []).slice(0, 6);
          for (const it of itens) {
            if (it.type === "PRODUCT") {
              [s, j] = await get(`/products/${it.id}`); show("produto " + it.id, s, { name: j.name, pics: j.pictures?.length, keys: Object.keys(j ?? {}), buy_box: j.buy_box_winner && { price: j.buy_box_winner.price, sold: j.buy_box_winner.sold_quantity, keys: Object.keys(j.buy_box_winner) } });
              [s, j] = await get(`/products/${it.id}/items`); show("produto itens", s, j, 600);
            } else {
              [s, j] = await get(`/items/${it.id}`); show("item " + it.id, s, { title: j.title, price: j.price, sold: j.sold_quantity, pics: j.pictures?.length, video: j.video_id, keys: Object.keys(j ?? {}) }, 1200);
              [s, j] = await get(`/items?ids=${it.id}&attributes=id,title,price,sold_quantity,thumbnail,permalink`); show("items multiget", s, j, 500);
              [s, j] = await get(`/visits/items?ids=${it.id}`); show("visitas", s, j, 300);
            }
          }
          await sql.end();
          JS
          REMOTO

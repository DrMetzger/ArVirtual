name: Diagnóstico concorrência ML (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-conc.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Vendedores do catálogo
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          import { createDecipheriv, createHash } from "node:crypto";
          const sql = postgres(process.env.DATABASE_URL);
          const key = createHash("sha256").update(process.env.ENCRYPTION_KEY).digest();
          const dec = (v) => { const [, iv, tag, data] = v.split(":"); const d = createDecipheriv("aes-256-gcm", key, Buffer.from(iv, "base64")); d.setAuthTag(Buffer.from(tag, "base64")); return Buffer.concat([d.update(Buffer.from(data, "base64")), d.final()]).toString("utf8"); };
          const [c] = await sql`select access_token_enc from contas_marketplace where marketplace = 'mercadolivre' limit 1`;
          const tk = dec(c.access_token_enc);
          const g = async (p) => { const t0 = Date.now(); const r = await fetch("https://api.mercadolibre.com" + p, { headers: { Authorization: `Bearer ${tk}` } }); return [r.status, await r.json().catch(() => null), Date.now() - t0]; };
          let [s, j, ms] = await g("/products/search?site_id=MLB&status=active&q=suporte%20alexa%20echo%20pop&limit=10");
          console.log("SEARCH", s, ms, "n", j?.results?.length, JSON.stringify(j?.results?.slice(0, 3)?.map((r) => ({ id: r.id, name: r.name }))));
          let it = [];
          const meus = await sql`select id_externo from sentinela_itens where fonte = 'mercadolivre' and vendedores > 3 order by vendedores desc limit 5`;
          for (const r of meus) { const [s2, j2] = await g(`/products/${r.id_externo}/items?limit=50`); console.log("PRODDB", r.id_externo, s2, j2?.results?.length ?? 0); if (j2?.results?.length) { it = j2.results; break; } }
          for (const r of j?.results ?? []) { const [s2, j2] = await g(`/products/${r.id}/items?limit=50`); console.log("PROD", r.id, s2, j2?.results?.length ?? 0); if (j2?.results?.length) { it = j2.results; break; } }
          console.log("ITEMS", s, ms, "n", it.length, "keys", Object.keys(it[0] ?? {}).join(","));
          console.log("ITEM0", JSON.stringify(it[0] ?? null).slice(0, 600));
          const sid = it[0]?.seller_id;
          [s, j, ms] = await g(`/users/${sid}`);
          console.log("USER", s, ms, JSON.stringify({ nick: j?.nickname, perm: j?.permalink, rep: j?.seller_reputation?.level_id, power: j?.seller_reputation?.power_seller_status, city: j?.address?.city, err: j?.error }));
          [s, j, ms] = await g(`/users?ids=${it.slice(0, 5).map((x) => x.seller_id).join(",")}`);
          console.log("USERS multi", s, ms, JSON.stringify(j).slice(0, 300));
          [s, j, ms] = await g(`/sites/MLB/search?seller_id=${sid}&limit=1`);
          console.log("SELLER search", s, j?.error ?? "", j?.paging?.total);
          await sql.end();
          JS
          REMOTO

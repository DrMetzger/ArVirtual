name: Diagnóstico Afiliados (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-afiliados.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Esquema e respostas da API de afiliados (sem dados pessoais)
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          import { createDecipheriv, createHash } from "node:crypto";
          const sql = postgres(process.env.DATABASE_URL);
          const rows = await sql`select chave, valor, secreto from configuracoes where chave in ('afiliados.appId','afiliados.secret')`;
          const key = createHash("sha256").update(process.env.ENCRYPTION_KEY).digest();
          const dec = (v) => { const [, iv, tag, data] = v.split(":"); const d = createDecipheriv("aes-256-gcm", key, Buffer.from(iv, "base64")); d.setAuthTag(Buffer.from(tag, "base64")); return Buffer.concat([d.update(Buffer.from(data, "base64")), d.final()]).toString("utf8"); };
          const cfg = Object.fromEntries(rows.map((r) => [r.chave, r.secreto ? dec(r.valor) : r.valor]));
          console.log("appId configurado:", Boolean(cfg["afiliados.appId"]), "secret:", Boolean(cfg["afiliados.secret"]));
          const chamar = async (query) => {
            const corpo = JSON.stringify({ query }); const ts = Math.floor(Date.now() / 1000);
            const sig = createHash("sha256").update(`${cfg["afiliados.appId"]}${ts}${corpo}${cfg["afiliados.secret"]}`).digest("hex");
            const r = await fetch("https://open-api.affiliate.shopee.com.br/graphql", { method: "POST", headers: { "Content-Type": "application/json", Authorization: `SHA256 Credential=${cfg["afiliados.appId"]}, Timestamp=${ts}, Signature=${sig}` }, body: corpo });
            return [r.status, await r.json().catch(async () => ({ texto: await r.text() }))];
          };
          const [s1, esquema] = await chamar("{ __schema { queryType { fields { name args { name type { name kind ofType { name } } } } } mutationType { fields { name } } } }");
          console.log("== esquema", s1, JSON.stringify(esquema.errors ?? ""));
          for (const f of esquema.data?.__schema?.queryType?.fields ?? []) console.log("query", f.name, "(", f.args.map((a) => a.name).join(", "), ")");
          for (const f of esquema.data?.__schema?.mutationType?.fields ?? []) console.log("mutation", f.name);
          const tipos = ["ProductOfferV2", "ConversionReport", "ConversionReportOrder", "ConversionReportOrderItem", "ValidatedReport"];
          for (const t of tipos) {
            const [, r] = await chamar(`{ __type(name: "${t}") { fields { name } } }`);
            console.log("tipo", t, (r.data?.__type?.fields ?? []).map((f) => f.name).join(","), JSON.stringify(r.errors ?? ""));
          }
          const [s2, ofertas] = await chamar('{ productOfferV2(keyword: "suporte controle ps5", sortType: 5, limit: 3) { nodes { itemId commissionRate sales priceMin } pageInfo { hasNextPage } } }');
          console.log("== ofertas", s2, JSON.stringify(ofertas).slice(0, 600));
          const agora = Math.floor(Date.now() / 1000);
          const [s3, conv] = await chamar(`{ conversionReport(purchaseTimeStart: ${agora - 30 * 86400}, purchaseTimeEnd: ${agora}, limit: 50) { nodes { conversionId purchaseTime clickTime buyerType device referrer utmContent totalCommission netCommission orders { orderStatus items { itemId qty itemPrice itemTotalCommission actualAmount } } } pageInfo { hasNextPage } } }`);
          console.log("== conversões 30 dias", s3, "nós:", conv.data?.conversionReport?.nodes?.length ?? "-", "erros:", JSON.stringify(conv.errors ?? "").slice(0, 600));
          await sql.end();
          JS
          REMOTO

name: Diagnóstico primeira coleta do sentinela (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-sent2.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Resultado da coleta
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose logs --since 15m app 2>&1 | grep -i "sentinela" | tail -15
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          const sql = postgres(process.env.DATABASE_URL);
          console.log("TOTAIS", JSON.stringify(await sql`select fonte, count(*)::int itens, count(analise)::int analisados, max(visto_em) ultimo from sentinela_itens group by fonte`));
          console.log("TERMOS", JSON.stringify(await sql`select origem, ativo, count(*)::int n, count(ultima_coleta)::int coletados from sentinela_termos group by 1,2`));
          for (const r of await sql`select fonte, termo, left(nome, 50) nome, preco, vendas, comissao, posicao, vendedores, analise->>'imprimivel' imp, analise->>'margem' margem from sentinela_itens order by vendas desc limit 12`) console.log("ITEM", JSON.stringify(r));
          for (const r of await sql`select left(nome, 50) nome, preco, analise->>'gramas' g, analise->>'margem' margem, analise->>'ideia' ideia from sentinela_itens where (analise->>'imprimivel')::boolean order by (analise->>'margem')::float desc limit 8`) console.log("IA", JSON.stringify(r));
          console.log("RELATORIO", JSON.stringify((await sql`select criado_em, left(texto, 600) t from sentinela_relatorios order by id desc limit 1`)[0] ?? null));
          await sql.end();
          JS
          REMOTO

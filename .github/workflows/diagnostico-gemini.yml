name: Diagnóstico Gemini imagens (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-gemini.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.APP_GEMINI }}
    steps:
      - name: Modelos de imagem e teste de geração
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ["KEY"]
          base = "https://generativelanguage.googleapis.com/v1beta"
          def req(url, body=None):
              r = urllib.request.Request(url, data=json.dumps(body).encode() if body else None, headers={"Content-Type": "application/json", "x-goog-api-key": key})
              try:
                  with urllib.request.urlopen(r, timeout=90) as f: return f.status, json.load(f)
              except urllib.error.HTTPError as e:
                  try: return e.code, json.load(e)
                  except Exception: return e.code, {}
          modelos, tok = [], ""
          while True:
              st, d = req(f"{base}/models?pageSize=200" + (f"&pageToken={tok}" if tok else ""))
              modelos += d.get("models", []); tok = d.get("nextPageToken")
              if not tok: break
          img = [m for m in modelos if any(k in m["name"] for k in ("image", "imagen", "banana"))]
          print("== modelos com imagem:")
          for m in img: print(m["name"], m.get("supportedGenerationMethods"))
          print("== teste")
          for m in img:
              n = m["name"]
              if "generateContent" in m.get("supportedGenerationMethods", []):
                  st, d = req(f"{base}/{n}:generateContent", {"contents": [{"parts": [{"text": "Um cubo azul simples, fundo branco."}]}], "generationConfig": {"responseModalities": ["TEXT", "IMAGE"]}})
                  partes = (d.get("candidates") or [{}])[0].get("content", {}).get("parts", [])
                  print(n, st, "imagem OK" if any("inlineData" in p for p in partes) else (d.get("error", {}).get("message", "")[:160] or "sem imagem"))
              elif "predict" in m.get("supportedGenerationMethods", []):
                  st, d = req(f"{base}/{n}:predict", {"instances": [{"prompt": "Um cubo azul simples, fundo branco."}], "parameters": {"sampleCount": 1}})
                  print(n, st, "imagem OK" if d.get("predictions") else d.get("error", {}).get("message", "")[:160])
          PY

name: Diagnóstico situação dos anúncios (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-anuncios.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Situação dos anúncios do suporte PS5 (sem dados pessoais)
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          for i in $(seq 1 20); do docker compose logs --since 30m app 2>&1 | grep -qi "sincroniz\|metricas\|anuncios" && break; sleep 30; done
          sleep 120
          docker compose logs --since 30m app 2>&1 | grep -i "\[anuncios\]\|\[metricas\]" | tail -5
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          const sql = postgres(process.env.DATABASE_URL);
          console.log(JSON.stringify(await sql`select p.sku, a.marketplace, a.id_externo, a.status, a.mensagem, a.atualizado_em from anuncios a join produtos p on p.id = a.produto_id where p.sku like 'SUP-PS5001%' order by p.sku, a.marketplace`, null, 0));
          console.log(JSON.stringify(await sql`select status, count(*)::int from anuncios group by 1`));
          await sql.end();
          JS
          REMOTO

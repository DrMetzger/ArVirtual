name: Diagnóstico Shopee (somente leitura, sem dados pessoais)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-shopee.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Campos mascarados por status (só contagens e nomes de campos)
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -A -F " | "' <<'SQL'
          select status, count(*) total,
            count(*) filter (where entrega->>'nome' like '%*%') nome_mascarado,
            count(*) filter (where entrega->>'endereco' like '%*%') endereco_mascarado,
            count(*) filter (where coalesce(entrega->>'documento','') <> '') com_documento,
            count(*) filter (where dados ? 'buyer_cpf_id') campo_cpf,
            min(data)::date, max(data)::date
          from pedidos_marketplace where marketplace = 'shopee' group by status order by 2 desc;
          select distinct jsonb_object_keys(dados) from pedidos_marketplace where marketplace = 'shopee' order by 1;
          select distinct jsonb_object_keys(dados->'recipient_address') from pedidos_marketplace where marketplace = 'shopee' and jsonb_typeof(dados->'recipient_address') = 'object' order by 1;
          SQL
          docker compose logs --since 3h app 2>&1 | grep -iE "shopee" | grep -viE "cpf|nome|name" | tail -15
          REMOTO

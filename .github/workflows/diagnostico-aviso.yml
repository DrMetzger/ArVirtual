name: Diagnóstico avisos no celular (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-aviso.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Conexão do celular e pedidos
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose logs --since 3h app 2>&1 | grep -iE "\[pedidos\]|\[push\]|novidades|busca rápida" | tail -10 | cut -c1-200
          docker compose logs --since 3h app 2>&1 | grep -c "POST /api/aparelhos/novidades" || true
          docker compose exec -T app node --input-type=module <<'JS'
          import postgres from "postgres";
          const sql = postgres(process.env.DATABASE_URL);
          for (let i = 0; i < 9; i++) {
            const [a] = await sql`select ultimo_acesso, bateria, carregando from aparelhos where id like '1a230f%'`;
            console.log("AMOSTRA", new Date().toISOString().slice(11, 19), "ultimo contato", a.ultimo_acesso.toISOString().slice(11, 19), "ha", Math.round((Date.now() - a.ultimo_acesso.getTime()) / 1000), "s", "bateria", a.bateria, a.carregando ? "carregando" : "");
            await new Promise((r) => setTimeout(r, 30000));
          }
          await sql.end();
          JS
          REMOTO

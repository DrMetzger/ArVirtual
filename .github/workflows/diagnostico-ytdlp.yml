name: Diagnóstico yt-dlp (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-ytdlp.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Versão e teste sem baixar
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app sh -c 'yt-dlp --version; python3 -c "import curl_cffi; print(\"curl_cffi\", curl_cffi.__version__)"; for u in https://www.tiktok.com/@scout2015/video/6718335390845095173 https://www.youtube.com/shorts/aqz-KE-bpKQ https://www.facebook.com/watch/?v=10153231379946729; do echo "== $u"; timeout 60 yt-dlp --no-progress --skip-download --print "%(title).60s | %(ext)s" "$u" 2>&1 | tail -1; done'
          REMOTO

name: Diagnóstico categorias Magalu (somente leitura)
on:
  push:
    branches: [claude/funny-mayer-500izs]
    paths: [.github/workflows/diagnostico-magalu-cat.yml]
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.VM_PSW }}
    steps:
      - name: Categoria e situação dos SKUs no Magalu
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p ${{ secrets.VM_PORT || '22' }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 ${{ secrets.VM_USER || 'root' }}@${{ secrets.VM_HOST }} "bash -s" <<'REMOTO'
          cd /opt/arvirtual-app
          docker compose exec -T app node --input-type=module </dev/null -e '
          import postgres from "postgres";
          import { createDecipheriv, createHash } from "node:crypto";
          const sql = postgres(process.env.DATABASE_URL);
          const key = createHash("sha256").update(process.env.ENCRYPTION_KEY).digest();
          const dec = (v) => { const [, iv, tag, data] = v.split(":"); const d = createDecipheriv("aes-256-gcm", key, Buffer.from(iv, "base64")); d.setAuthTag(Buffer.from(tag, "base64")); return Buffer.concat([d.update(Buffer.from(data, "base64")), d.final()]).toString("utf8"); };
          const [c] = await sql`select access_token_enc from contas_marketplace where marketplace = ${"magalu"} limit 1`;
          const tk = dec(c.access_token_enc);
          const g = async (p) => { try { const r = await fetch("https://api.magalu.com" + p, { headers: { Authorization: "Bearer " + tk, Accept: "application/json" } }); const t = await r.text(); let j = null; try { j = JSON.parse(t); } catch {} return [r.status, j]; } catch (e) { return ["falhou", null]; } };
          for (const p of ["/seller/v1/portfolios/categories?_limit=5", "/seller/v1/categories?_limit=5", "/seller/v1/catalog/categories?_limit=5", "/seller/v1/portfolios/skus?_limit=5"]) {
            const [s, j] = await g(p);
            console.log(p, s, j ? Object.keys(j).join(",") : "-", j ? JSON.stringify(j).slice(0, 300) : "");
          }
          const skus = await sql`select a.id_externo from anuncios a where a.marketplace = ${"magalu"} order by a.criado_em desc limit 4`;
          for (const s of skus) {
            const [st, j] = await g("/seller/v1/portfolios/skus/" + encodeURIComponent(s.id_externo));
            if (!j) { console.log("sku", st); continue; }
            console.log("sku", st, "status", j.status, "categoria", JSON.stringify(j.category ?? j.categories ?? null).slice(0, 200), "campos", Object.keys(j).join(","));
            for (const k of ["status_detail", "statuses", "pendencies", "issues", "errors", "review", "quality"]) if (j[k]) console.log("  ", k, JSON.stringify(j[k]).slice(0, 400));
          }
          await sql.end();
          '
          REMOTO
